<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Only this app's own code may run (plus Google's sign-in helper). Network access is limited to the open
       product/price databases, the subscription service and the account service (Firebase).
       Product photos only from Open Food Facts' image servers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.openfoodfacts.org https://static.openfoodfacts.org; connect-src 'self' https://world.openfoodfacts.org https://prices.openfoodfacts.org https://api.revenuecat.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://*.cloudfunctions.net; frame-src https://*.firebaseapp.com https://*.web.app https://apis.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f9d55">
  <meta name="description" content="Weekly meal plan and shopping list for your supermarket, diet and family.">
  <title>Weekly Basket</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Weekly Basket">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="splash">🧺</div></div>
  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/products.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/access.js"></script>
  <script src="js/vendor/firebase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/account.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
